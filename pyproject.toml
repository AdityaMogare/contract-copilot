[project]
name = "contract-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "azure-identity>=1.27.0",
    "azure-keyvault-secrets>=4.12.0",
    "azure-search-documents>=12.1.0",
    "azure-storage-blob>=12.31.1",
    "fastapi>=0.163.0",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
